# Builds the Space Math iPad app (space-math-ios/) into an unsigned .ipa on a
# macOS runner, so it can be produced without a Mac. Sign and install it on the
# iPad from Windows with Sideloadly (see space-math-ios/README.md).
name: Space Math iOS

on:
  push:
    branches: [main]
    paths:
      - "space-math-ios/**"
      - ".github/workflows/space-math-ios.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: space-math-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: space-math-ios/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install, test and build web bundle
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry SpaceMath.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMath-ipa
          path: space-math-ios/SpaceMath.ipa
          retention-days: 30
